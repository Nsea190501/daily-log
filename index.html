<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><title>Daily Log</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Daily Log"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:520px;margin:auto;min-height:100dvh;padding:20px 16px 95px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;margin:0}h2{font-size:18px;margin:24px 0 12px}.muted{color:#667085;font-size:13px}.panel{background:white;border:1px solid #e5eaf2;border-radius:16px;padding:16px;margin:12px 0}.habit{display:flex;align-items:center;gap:12px}.habit input[type=checkbox]{width:25px;height:25px;accent-color:#2563eb}.grow{flex:1;min-width:0}.name{font-weight:650;overflow-wrap:anywhere}.score{font-weight:750;font-size:21px;white-space:nowrap}.positive{color:#12805c}.negative{color:#c43f43}.small{font-size:12px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}button,input,textarea{font:inherit}button{border:0;border-radius:11px;padding:12px 15px;background:#2563eb;color:white;font-weight:650;cursor:pointer}button.secondary{background:#e9effb;color:#244b8c}button.danger{background:#fff0f0;color:#b4232a}button:disabled{opacity:.45;cursor:not-allowed}input:not([type=checkbox]),textarea{width:100%;border:1px solid #cdd5e2;border-radius:10px;padding:12px;background:white;color:#172033}textarea{min-height:145px;resize:vertical}.full{width:100%}.field{margin:10px 0}.field label{display:block;margin-bottom:6px;font-size:13px;font-weight:650}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:white;border-top:1px solid #dce3ef;padding:8px 10px max(8px,env(safe-area-inset-bottom))}.nav-inner{display:flex;width:min(100%,520px);gap:8px}.nav button{flex:1;background:transparent;color:#667085;font-size:13px;padding:9px 4px}.nav button.active{background:#eaf1ff;color:#1d4ed8}.hidden{display:none}.note{font-size:12px;color:#667085;line-height:1.6}.pill{font-size:12px;border-radius:100px;padding:5px 9px;background:#eef2f7;color:#526078}.history-item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #edf0f5;padding:12px 0}.history-item:last-child{border-bottom:0}.empty{padding:24px;text-align:center;color:#667085}button.tiny{font-size:12px;padding:8px 10px} .status{margin:12px 0;color:#116149;font-size:13px;min-height:18px}.chart{width:100%;height:auto;display:block}.chart-controls{display:flex;gap:6px;flex-wrap:wrap}.chart-controls button{flex:1;padding:9px 5px}.chart-controls .selected{background:#2563eb;color:white}.chart-controls button:not(.selected){background:#e9effb;color:#244b8c}.legend{font-size:12px;color:#667085;line-height:1.6}.days{display:flex;gap:5px;flex-wrap:wrap}.days label{display:flex;align-items:center;gap:3px;background:#eef2f7;border-radius:9px;padding:8px 6px;font-size:12px}.days input{accent-color:#2563eb}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f2f6fc;border-radius:12px;padding:12px 6px;text-align:center}.stat b{font-size:19px;display:block}.linklike{background:transparent;color:#2563eb;padding:5px 0;text-align:left}.subheading{margin:18px 0 8px;font-weight:700}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calendar button{padding:9px 1px;background:#f0f3f8;color:#263349;font-size:12px;min-height:40px}.calendar button.confirmed{background:#d9f5e8;color:#116149}.calendar button.chosen{outline:2px solid #2563eb}.calendar .weekday{text-align:center;font-size:12px;color:#667085}.move{display:flex;gap:5px;margin-top:8px}.move button{padding:7px 10px}.draftnotice{color:#2563eb;font-size:12px}</style></head><body><main class="app"><header><div><h1>Daily Log</h1><div class="muted">習慣と日記の記録</div></div><span class="pill" id="date-label"></span></header>
<section id="today-view"><h2>今日の習慣</h2><div id="today-habits"></div><div class="panel"><h2 style="margin-top:0">今日の日記</h2><textarea id="today-diary" placeholder="今日あったこと、感じたことなどを自由に記録…"></textarea><div class="status" id="today-status"></div><button class="full" id="confirm-btn">今日の記録を確定する</button><p class="note">確定するまで点数は変わりません。確定後の修正は当日の設定値で再計算します。</p></div></section>
<section id="detail-view" class="hidden"><button class="secondary tiny" id="detail-back">← 戻る</button><h2 id="detail-title"></h2><div id="detail-content"></div></section><section id="history-view" class="hidden"><h2>記録履歴</h2><div class="panel"><div class="row between"><button class="secondary tiny" id="cal-prev">◀ 前月</button><strong id="cal-title"></strong><button class="secondary tiny" id="cal-next">翌月 ▶</button></div><div id="history-calendar" class="calendar" style="margin-top:12px"></div><p class="note">緑：確定済み　灰：未確定　青枠：選択中</p></div><div class="panel"><div class="field"><label for="history-date">確認・編集する日付</label><input type="date" id="history-date"></div><div id="history-editor"></div></div><h2>確定済みの日付</h2><div class="panel" id="history-list"></div></section>
<section id="charts-view" class="hidden"><h2>習慣ごとのスコア推移</h2><div class="panel"><div class="field"><label for="chart-habit">表示する習慣</label><select id="chart-habit" style="width:100%;padding:12px;border:1px solid #cdd5e2;border-radius:10px;background:white"></select></div><div class="chart-controls" id="chart-period"><button data-period="daily" class="selected">日別</button><button data-period="weekly">週間</button><button data-period="monthly">月間</button></div><div id="chart-display" style="margin-top:16px"></div><p class="legend">各期間の終わり時点での累計スコアを表示します。記録がない期間はスコアが変わりません。</p></div></section><section id="settings-view" class="hidden"><h2>習慣を追加</h2><div class="panel"><form id="habit-form"><div class="field"><label for="habit-name">習慣名</label><input id="habit-name" required maxlength="60" placeholder="例：運動をする"></div><div class="grid"><div class="field"><label for="habit-plus">達成時の加点</label><input id="habit-plus" type="number" min="0" max="100000" step="1" value="10" required></div><div class="field"><label for="habit-minus">未達成時の減点</label><input id="habit-minus" type="number" min="0" max="100000" step="1" value="5" required></div></div><div class="field"><label>実施する曜日</label><div class="days" id="new-days"></div></div><button class="full" type="submit">習慣を追加</button></form></div><h2>登録した習慣</h2><div id="settings-habits"></div><h2>終了した習慣</h2><div id="ended-habits"></div><h2>バックアップ</h2><div class="panel"><p class="note">データはこのブラウザー内に保存されます。機種変更・ブラウザーのデータ削除に備えて定期的にバックアップしてください。</p><div class="row"><button class="secondary grow" id="export-btn">JSONを書き出す</button><button class="secondary grow" id="import-btn">JSONを読み込む</button></div><input type="file" id="import-file" accept="application/json,.json" class="hidden"></div></section></main>
<nav class="nav"><div class="nav-inner"><button data-view="today" class="active">✓ 今日の記録</button><button data-view="history">▦ 履歴</button><button data-view="charts">▥ グラフ</button><button data-view="settings">⚙ 習慣設定</button></div></nav>
<script>
(()=>{'use strict';const KEY='daily-log-v1', DRAFTKEY='daily-log-v1-drafts';const localDate=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=localDate();const $=id=>document.getElementById(id);const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db||!Array.isArray(db.habits)||!db.records)db={habits:[],records:{}};// 旧形式の確定済み記録には当時の設定値がないため、移行時点の設定で一度だけ確定値を固定する。
for(const [date,r] of Object.entries(db.records)){if(r?.confirmed&&!r.awards){r.awards={};r.rates={};for(const h of db.habits.filter(h=>h.created<=date&&(h.archived==null||h.archived>date))){r.rates[h.id]={plus:h.plus,minus:h.minus};r.awards[h.id]=r.checks?.[h.id]?h.plus:-h.minus}}}
try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}
const weekdays=['日','月','火','水','木','金','土'];const normalizeDays=h=>Array.isArray(h.days)?h.days:[0,1,2,3,4,5,6];const policyAt=(h,date)=>{const versions=Array.isArray(h.versions)&&h.versions.length?h.versions:[{from:h.created,plus:h.plus,minus:h.minus,days:normalizeDays(h)}];return versions.filter(v=>v.from<=date).sort((a,b)=>a.from.localeCompare(b.from)).at(-1)||versions[0]};const sessions=h=>{if(Array.isArray(h.sessions))return h.sessions;return [{start:h.created,end:h.archived||null}]};const activeOn=(h,date)=>sessions(h).some(x=>x.start<=date&&(!x.end||date<x.end))&&policyAt(h,date).days.includes(new Date(date+'T12:00:00').getDay());const existsOn=(h,date)=>sessions(h).some(x=>x.start<=date&&(!x.end||date<x.end));const ended=h=>sessions(h).every(x=>!!x.end);const daysMarkup=(selected,prefix)=>weekdays.map((day,i)=>`<label><input type="checkbox" data-day="${i}" ${selected.includes(i)?'checked':''}>${day}</label>`).join('');const getDays=container=>[...container.querySelectorAll('[data-day]:checked')].map(e=>Number(e.dataset.day));let detailId='';let detailFrom='today';let chartHabit='';let chartPeriod='daily';let draft={};let historyDraft={};let drafts={};try{drafts=JSON.parse(localStorage.getItem(DRAFTKEY))||{}}catch{}const persistDraft=(date,d)=>{drafts[date]={checks:{...d.checks},diary:d.diary};try{localStorage.setItem(DRAFTKEY,JSON.stringify(drafts))}catch(e){$('today-status').textContent='一時保存に失敗しました。バックアップを確認してください。'}};let historyDate=today;let active='today';const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('保存に失敗しました。端末の空き容量やブラウザーの設定を確認してください。');return false}};const score=h=>Object.entries(db.records).reduce((n,[date,r])=>n+(r.confirmed&&Object.prototype.hasOwnProperty.call(r.awards||{},h.id)?Number(r.awards[h.id]):0),0);const record=date=>db.records[date]||null;const activeHabits=date=>db.habits.filter(h=>activeOn(h,date));function initDraft(date){let r=drafts[date]||record(date);return {checks:{...(r?.checks||{})},diary:r?.diary||''}};const inputChecks=(date,checks,prefix)=>activeHabits(date).map(h=>`<div class="panel habit"><input type="checkbox" id="${prefix}-${escape(h.id)}" data-id="${escape(h.id)}" ${checks[h.id]?'checked':''}><div class="grow"><button class="linklike name" data-detail="${escape(h.id)}">${escape(h.name)} ›</button><div class="muted small">達成 +${h.plus} / 未達成 -${h.minus}</div></div><div class="score ${score(h)>=0?'positive':'negative'}">${score(h)} pt</div></div>`).join('')||'<div class="empty">この日に対象となる習慣はありません。</div>';
function renderToday(){const r=record(today);$('today-habits').innerHTML=inputChecks(today,draft.checks,'today');bindDetail($('today-habits'),'today');$('today-habits').querySelectorAll('input[type=checkbox]').forEach(el=>el.onchange=()=>{draft.checks[el.dataset.id]=el.checked;persistDraft(today,draft);updateTodayStatus()});$('today-diary').value=draft.diary;updateTodayStatus();$('confirm-btn').textContent=r?.confirmed?'今日の記録を再確定する':'今日の記録を確定する'}function updateTodayStatus(){$('today-status').textContent=record(today)?.confirmed?'この日は確定済みです。変更後は再確定してください。':'未確定：まだ点数に反映されていません。'}
function commit(date,d){if(date>today){alert('未来の日付は確定できません。');return false}const previous=record(date);const next={confirmed:true,checks:{},diary:d.diary||'',rates:{...(previous?.rates||{})},awards:{}};for(const h of activeHabits(date)){next.checks[h.id]=!!d.checks[h.id];const pol=policyAt(h,date);const rate=next.rates[h.id]||(next.rates[h.id]={plus:pol.plus,minus:pol.minus});next.awards[h.id]=next.checks[h.id]?rate.plus:-rate.minus}const old=db.records[date];db.records[date]=next;if(!save()){if(old)db.records[date]=old;else delete db.records[date];return false}delete drafts[date];try{localStorage.setItem(DRAFTKEY,JSON.stringify(drafts))}catch{}if(date===today)draft=initDraft(today);if(date===historyDate)historyDraft=initDraft(historyDate);renderAll();return true}
$('confirm-btn').onclick=()=>commit(today,draft);$('today-diary').oninput=e=>{draft.diary=e.target.value;persistDraft(today,draft)};
function renderHistory(){const r=record(historyDate);$('history-date').value=historyDate;$('history-date').max=today;$('history-editor').innerHTML=`<div class="muted" style="margin:12px 0">${r?.confirmed?'確定済み':'未確定'}</div>${inputChecks(historyDate,historyDraft.checks,'history')}<div class="field"><label>日記</label><textarea id="history-diary" placeholder="この日の日記…">${escape(historyDraft.diary)}</textarea></div><button class="full" id="history-save">${r?.confirmed?'修正して再確定':'この日の記録を確定する'}</button>`;bindDetail($('history-editor'),'history');$('history-editor').querySelectorAll('input[type=checkbox]').forEach(el=>el.onchange=()=>{historyDraft.checks[el.dataset.id]=el.checked;persistDraft(historyDate,historyDraft)});$('history-diary').oninput=e=>{historyDraft.diary=e.target.value;persistDraft(historyDate,historyDraft)};$('history-save').onclick=()=>{if(commit(historyDate,historyDraft)){$('history-editor').scrollIntoView({block:'start',behavior:'smooth'})}};renderCalendar();const dates=Object.keys(db.records).filter(d=>db.records[d].confirmed).sort().reverse();$('history-list').innerHTML=dates.length?dates.map(d=>`<div class="history-item"><div><b>${escape(d)}</b><div class="muted">${activeHabits(d).filter(h=>db.records[d].checks?.[h.id]).length}/${activeHabits(d).length} 項目達成</div></div><button class="secondary tiny" data-date="${escape(d)}">開く</button></div>`).join(''):'<div class="empty">確定済みの記録はまだありません。</div>';$('history-list').querySelectorAll('button').forEach(el=>el.onclick=()=>{historyDate=el.dataset.date;historyDraft=initDraft(historyDate);renderHistory();window.scrollTo(0,0)})}
let calMonth=today.slice(0,7);function renderCalendar(){const [y,m]=calMonth.split('-').map(Number);$('cal-title').textContent=`${y}年${m}月`;const first=new Date(y,m-1,1).getDay(),count=new Date(y,m,0).getDate();let html=weekdays.map(x=>`<span class="weekday">${x}</span>`).join('');for(let i=0;i<first;i++)html+='<span></span>';for(let i=1;i<=count;i++){const d=`${calMonth}-${String(i).padStart(2,'0')}`;html+=`<button ${d>today?'disabled':''} class="${record(d)?.confirmed?'confirmed':''} ${d===historyDate?'chosen':''}" data-cal="${d}">${i}</button>`}$('history-calendar').innerHTML=html;$('history-calendar').querySelectorAll('[data-cal]').forEach(b=>b.onclick=()=>{historyDate=b.dataset.cal;historyDraft=initDraft(historyDate);renderHistory()})}function shiftMonth(n){const [y,m]=calMonth.split('-').map(Number);const d=new Date(y,m-1+n,1);calMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;renderCalendar()}$('cal-prev').onclick=()=>shiftMonth(-1);$('cal-next').onclick=()=>shiftMonth(1);
$('history-date').onchange=e=>{if(!e.target.value||e.target.value>today)return;historyDate=e.target.value;calMonth=historyDate.slice(0,7);historyDraft=initDraft(historyDate);renderHistory()};
function renderSettings(){const cards=h=>`<div class="panel"><div class="row between"><div class="grow"><button class="linklike name" data-detail="${escape(h.id)}">${escape(h.name)} ›</button><div class="muted">+${h.plus} / -${h.minus}　累計 ${score(h)} pt</div><div class="muted small">実施曜日：${normalizeDays(h).map(i=>weekdays[i]).join('・')}</div></div>${ended(h)?`<button class="secondary tiny" data-restart="${escape(h.id)}">再開</button>`:`<button class="secondary tiny" data-edit="${escape(h.id)}">編集</button><button class="secondary tiny" data-archive="${escape(h.id)}">終了</button>`}<button class="danger tiny" data-delete="${escape(h.id)}">削除</button></div><div class="move"><button class="secondary tiny" data-move="${escape(h.id)}" data-dir="-1">↑ 上へ</button><button class="secondary tiny" data-move="${escape(h.id)}" data-dir="1">↓ 下へ</button></div></div>`;
$('settings-habits').innerHTML=db.habits.filter(h=>!ended(h)).map(cards).join('')||'<div class="empty">登録した習慣はありません。</div>';$('ended-habits').innerHTML=db.habits.filter(ended).map(cards).join('')||'<div class="empty">終了した習慣はありません。</div>';
for(const root of [$('settings-habits'),$('ended-habits')]){bindDetail(root,'settings');root.querySelectorAll('[data-move]').forEach(el=>el.onclick=()=>{const idx=db.habits.findIndex(h=>h.id===el.dataset.move);const other=idx+Number(el.dataset.dir);if(other<0||other>=db.habits.length)return;[db.habits[idx],db.habits[other]]=[db.habits[other],db.habits[idx]];if(save())renderAll()});root.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>{const h=db.habits.find(h=>h.id===el.dataset.edit);const name=prompt('習慣名',h.name);if(name===null)return;if(!name.trim())return alert('習慣名を入力してください');const plus=prompt('達成時の加点（0以上の整数）',h.plus);if(plus===null)return;const minus=prompt('未達成時の減点（0以上の整数）',h.minus);if(minus===null)return;if(!validPoint(plus)||!validPoint(minus))return alert('0～100000の整数を指定してください');const days=prompt('実施曜日（0=日,1=月,…,6=土）。カンマ区切り',normalizeDays(h).join(','));if(days===null)return;const parsed=days.split(',').map(v=>Number(v.trim()));if(!parsed.length||parsed.some(v=>!Number.isInteger(v)||v<0||v>6)||new Set(parsed).size!==parsed.length)return alert('曜日は0～6から選択してください');const before=structuredCloneSafe(db);h.versions=h.versions||[{from:h.created,plus:h.plus,minus:h.minus,days:normalizeDays(h)}];h.versions=h.versions.filter(v=>v.from!==today);h.versions.push({from:today,plus:Number(plus),minus:Number(minus),days:parsed});h.name=name.trim();h.plus=Number(plus);h.minus=Number(minus);h.days=parsed;if(!save()){db=before;return}renderAll()});root.querySelectorAll('[data-archive]').forEach(el=>el.onclick=()=>{const h=db.habits.find(h=>h.id===el.dataset.archive);if(!confirm(`「${h.name}」を終了しますか？過去の記録は残ります。`))return;const before=structuredCloneSafe(db);const ss=sessions(h);ss[ss.length-1].end=today;h.sessions=ss;h.archived=today;if(!save()){db=before;return}draft=initDraft(today);historyDraft=initDraft(historyDate);renderAll()});root.querySelectorAll('[data-restart]').forEach(el=>el.onclick=()=>{const h=db.habits.find(h=>h.id===el.dataset.restart);if(!confirm(`「${h.name}」を今日から再開しますか？`))return;const before=structuredCloneSafe(db);h.sessions=[...sessions(h),{start:today,end:null}];h.archived=null;if(!save()){db=before;return}draft=initDraft(today);renderAll()});root.querySelectorAll('[data-delete]').forEach(el=>el.onclick=()=>{const h=db.habits.find(h=>h.id===el.dataset.delete);if(!confirm(`「${h.name}」を完全削除しますか？過去の点数・グラフも消え、元に戻せません。`))return;const before=structuredCloneSafe(db);db.habits=db.habits.filter(x=>x.id!==h.id);for(const r of Object.values(db.records)){delete r.checks?.[h.id];delete r.rates?.[h.id];delete r.awards?.[h.id]}if(!save()){db=before;return}renderAll()})}}
const structuredCloneSafe=obj=>JSON.parse(JSON.stringify(obj));
const validPoint=v=>/^\d+$/.test(String(v))&&Number(v)<=100000;$('habit-form').onsubmit=e=>{e.preventDefault();const name=$('habit-name').value.trim(),plus=$('habit-plus').value,minus=$('habit-minus').value;if(!name||!validPoint(plus)||!validPoint(minus))return alert('習慣名と0～100000の整数を入力してください');const newHabit={id:(typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function')?crypto.randomUUID():'habit-'+Date.now()+'-'+Math.random().toString(36).slice(2),name,plus:Number(plus),minus:Number(minus),created:today,archived:null,days:getDays($('new-days')),sessions:[{start:today,end:null}],versions:[{from:today,plus:Number(plus),minus:Number(minus),days:getDays($('new-days'))}]};if(!newHabit.days.length)return alert('実施曜日を1つ以上選択してください');db.habits.push(newHabit);if(!save()){db.habits.pop();return}$('habit-name').value='';renderAll();$('settings-view').querySelector('#settings-habits').scrollIntoView({behavior:'smooth',block:'nearest'})};
$('export-btn').onclick=()=>{const blob=new Blob([JSON.stringify({format:'daily-log-backup-v1.4',exportedAt:new Date().toISOString(),habits:db.habits,records:db.records,drafts},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`daily-log-backup-${today}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import-btn').onclick=()=>$('import-file').click();$('import-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!Array.isArray(obj.habits)||!obj.records||typeof obj.records!=='object'||Array.isArray(obj.records)||obj.habits.some(h=>typeof h.id!=='string'||typeof h.name!=='string'||typeof h.created!=='string'||!validPoint(h.plus)||!validPoint(h.minus)||h.versions&&!Array.isArray(h.versions)))throw Error('形式が正しくありません');if(Object.entries(obj.records).some(([date,r])=>!/^\d{4}-\d{2}-\d{2}$/.test(date)||!r||typeof r!=='object'||(r.confirmed&&(!r.awards||!r.rates))))throw Error('記録の形式が正しくありません');if(!confirm('現在のデータをバックアップ内容で置き換えますか？ 事前に現在のデータを書き出してください。'))return;const old=db;db={habits:obj.habits,records:obj.records};if(!save()){db=old;return}drafts=obj.drafts&&typeof obj.drafts==='object'&&!Array.isArray(obj.drafts)?obj.drafts:{};try{localStorage.setItem(DRAFTKEY,JSON.stringify(drafts))}catch{}draft=initDraft(today);historyDraft=initDraft(historyDate);renderAll()}catch(err){alert('読み込みできませんでした：'+err.message)}finally{e.target.value=''}};
function renderChart(){const select=$('chart-habit');const all=db.habits;if(!all.length){select.innerHTML='';$('chart-display').innerHTML='<div class="empty">習慣を登録するとグラフが表示されます。</div>';return}if(!all.some(h=>h.id===chartHabit))chartHabit=all[0].id;select.innerHTML=all.map(h=>`<option value="${escape(h.id)}" ${h.id===chartHabit?'selected':''}>${escape(h.name)}</option>`).join('');const h=all.find(h=>h.id===chartHabit);document.querySelectorAll('[data-period]').forEach(b=>b.classList.toggle('selected',b.dataset.period===chartPeriod));const dates=Object.keys(db.records).filter(d=>db.records[d]?.confirmed&&Object.prototype.hasOwnProperty.call(db.records[d].awards||{},h.id)).sort();if(!dates.length){$('chart-display').innerHTML='<div class="empty">この習慣の確定済み記録はまだありません。</div>';return}const keyFor=d=>{if(chartPeriod==='daily')return d;if(chartPeriod==='monthly')return d.slice(0,7);const dt=new Date(d+'T12:00:00');const dow=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-dow);return localDate(dt)};const sums=new Map();for(const d of dates){const key=keyFor(d);sums.set(key,(sums.get(key)||0)+Number(db.records[d].awards?.[h.id]??0))}const keys=[...sums.keys()].sort();let running=0;const points=keys.map(k=>({key:k,value:running+=sums.get(k)}));const shown=points.slice(-24);const values=shown.map(x=>x.value);let min=Math.min(0,...values),max=Math.max(0,...values);if(min===max){min-=5;max+=5}const w=360,height=230,left=46,right=12,top=20,bottom=43;const X=i=>left+(shown.length===1?(w-left-right)/2:i*(w-left-right)/(shown.length-1));const Y=v=>top+(max-v)/(max-min)*(height-top-bottom);const line=shown.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.value).toFixed(1)}`).join(' ');const ticks=[0,1,2,3,4].map(i=>{const v=min+(max-min)*i/4;return `<line x1="${left}" y1="${Y(v)}" x2="${w-right}" y2="${Y(v)}" stroke="#e7eaf0"/><text x="${left-6}" y="${Y(v)+4}" text-anchor="end" fill="#667085" font-size="10">${Math.round(v)}</text>`}).join('');const labelIndices=[...new Set([0,Math.floor((shown.length-1)/2),shown.length-1])];const labels=labelIndices.map(i=>`<text x="${X(i)}" y="${height-12}" text-anchor="middle" fill="#667085" font-size="10">${escape(shown[i].key.slice(5)||shown[i].key)}</text>`).join('');const circles=shown.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.value)}" r="3.5" fill="#2563eb"><title>${escape(p.key)}: ${p.value} pt</title></circle>`).join('');$('chart-display').innerHTML=`<div class="row between"><span class="muted">最新の累計スコア</span><strong class="score ${running>=0?'positive':'negative'}">${running} pt</strong></div><svg class="chart" viewBox="0 0 ${w} ${height}" role="img" aria-label="${escape(h.name)}の累計スコア推移">${ticks}<path d="${line}" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${circles}${labels}</svg><p class="note">表示：直近${shown.length}期間（記録がある期間）</p>`}
$('chart-habit').onchange=e=>{chartHabit=e.target.value;renderChart()};document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{chartPeriod=b.dataset.period;renderChart()});
function streaks(h){const dates=[];const cursor=new Date(today+'T12:00:00');const start=new Date(h.created+'T12:00:00');for(let i=0;i<20000&&cursor>=start;i++,cursor.setDate(cursor.getDate()-1)){const d=localDate(cursor);if(activeOn(h,d))dates.push(d)}let best=0,run=0;for(const d of dates.slice().reverse()){if(db.records[d]?.confirmed&&db.records[d].checks?.[h.id]){run++;best=Math.max(best,run)}else run=0}let current=0;for(const d of dates){if(!db.records[d]?.confirmed&&d===today)continue;if(db.records[d]?.confirmed&&db.records[d].checks?.[h.id])current++;else break}return {current,best}}
